[package]
name = "vectorcraft-hmos"
version = "0.23.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "vectorcraft_hmos"
crate-type = ["staticlib"]

# 瘦身 profile：thin LTO 做跨 crate 死代码消除 + codegen-units=1（LTO 生效前提）+
# 去掉 .a 调试信息。保留默认 opt-level=3（图形应用不牺牲帧率）。
# 说明：fat LTO 体积更小但 440 crate 的链接极慢/易 OOM，首版用 thin 平衡体积与构建时长；
# 如需更极致可改 lto="fat"（构建时间会显著上升）。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dependencies]
# 上游前端与引擎：path 依赖，上游文件零改动。VectorCraft 的 `VectorcraftApp` 已把宿主缝直接
# 暴露为 `new(Session, Services)` / `install_ime_reset_hooks(ctx)` / `logic(ctx)` / `ui(ui)`
# （"eframe isn't a dependency of this crate (the host owns the event loop)"，见 ui-egui/app.rs 注释），
# 本适配层正是它的第三个宿主实现（与 apps/vectorcraft 桌面、apps/vectorcraft-web 并列），
# 与 gridcraft 的 SheetApp / solidcraft 的 SolveApp 同构。
vectorcraft-ui-egui = { path = "../../../vectorcraft/crates/ui-egui" }
vectorcraft-engine = { path = "../../../vectorcraft/crates/engine" }
# egui 0.37 / egui-wgpu 0.37：与 vectorcraft 根 Cargo.toml 的 [patch] 同一 git fork rev，
# 否则跨边界 egui 类型全对不上。egui features 与 ui-egui 保持一致（bytemuck/default_fonts/monochrome_emoji_fonts）。
egui = { version = "0.37", features = ["bytemuck", "default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = { version = "0.37" }
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；vectorcraft 桌面走 DX12/Metal、web 走 WebGL，均未开 gles。
# 丢 gles 鸿蒙就没渲染后端（同 photocraft/solidcraft/gridcraft 教训）。
# vectorcraft 的 wgpu 版本 = 30.0.1（Cargo.lock 核实），与 gridcraft 一致，
# 故可复用 solidcraft 验证过的 vendored wgpu-hal-30.0.1（GLES uniform-block 修补）。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "gles"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
libc = "0.2"

# [patch] 只对 workspace 根生效；本适配层是独立 workspace，必须把 vectorcraft 根 Cargo.toml 的
# [patch.crates-io] 整段抄过来，再叠加 wgpu-hal 的鸿蒙 GLES 修补。
# vectorcraft 相比 gridcraft 额外 patch 了 hayro-* / krilla（vectorcraft-pdf 的 PDF 依赖，
# 指向 craft-libs rev 9be9a637…）——缺了它们，pdf crate 会去拉 crates.io 的 hayro/krilla，
# 版本/实现不匹配而编译失败。
[patch.crates-io]
# PDF 依赖：vectorcraft-pdf 经 workspace 引 hayro/krilla，patch 到 craft-libs 的 rev。
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "9be9a63782298ab59cd9b7a42ee9cba4f42a5ccb" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "9be9a63782298ab59cd9b7a42ee9cba4f42a5ccb" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "9be9a63782298ab59cd9b7a42ee9cba4f42a5ccb" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "9be9a63782298ab59cd9b7a42ee9cba4f42a5ccb" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "9be9a63782298ab59cd9b7a42ee9cba4f42a5ccb" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "9be9a63782298ab59cd9b7a42ee9cba4f42a5ccb" }
# 上游 main（0a702cc0）新增：pathops 依赖的 linesweeper 指向另一个 craft-libs rev。
# 不抄这条会去 crates.io 拉未打补丁的 linesweeper，与新版 pathops 的 API 不匹配。
linesweeper = { git = "https://github.com/storytold/craft-libs", rev = "481f66d287b2a06845f3667a19daf35f0fe958ed" }
# egui 全家桶：vectorcraft 用的 fork，rev 必须与上游锁一致。
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# wgpu-hal：鸿蒙 GLES 需 uniform-block 修补。vectorcraft 与 gridcraft 同为 wgpu 30.0.1，
# 直接沿用 solidcraft 验证过的 30.0.1；目录不存在即报错。
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }

[workspace]
